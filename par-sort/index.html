<!doctype html>
<meta charset="utf-8">
<title>Parallel sort</title>
<style>
  body { margin: 16px; background: #111; color: #ccc; display: flex;
    flex-direction: column; align-items: center; gap: 12px;
    font: 14px/1.4 ui-monospace, monospace; }
  canvas { max-width: 100%; image-rendering: pixelated; }
  pre { margin: 0; white-space: pre-wrap; max-width: 100%; }
  select { font: inherit; color: inherit; background: #222; border: 1px solid #444; }
</style>
<canvas id="bend"></canvas>
<pre><select id="bend-threads"></select> threads, <span id="bend-rate"></span></pre>
<pre id="bend-out"></pre>
<p style="max-width: 640px"><a href="../">&larr; all demos</a> · <b>Parallel sort</b>: a bitonic sort of a tree of 2<sup>16</sup> numbers in one <code>!</code>; prints sorted.<br>
The <code>!</code> runs on your GPU through WebGPU where the browser has it; the line above says where.
<a href="?gpu=off">The same page on the CPU cores</a> · <a href="?">on the GPU</a> ·
<a href="#" onclick="document.getElementById('bend').requestFullscreen(); return false">fullscreen</a></p>
<style>a { color: #8cf; }</style>
<script>
  var cores   = navigator.hardwareConcurrency;
  var query   = new URLSearchParams(location.search);
  var threads = Math.min(Number(query.get("threads")) || cores, cores);
  var select  = document.getElementById("bend-threads");
  for (var i = 1; i <= cores; i += 1) {
    select.appendChild(new Option(i, i));
  }
  select.value = threads;
  select.onchange = function() {
    query.set("threads", select.value);
    location.search = query;
  };
  var say = function(text) {
    document.getElementById("bend-out").append(text + "\n");
  };
  var Module = {
    arguments: ["--threads", String(threads)].concat(query.get("gpu")
      ? ["--gpu", query.get("gpu")] : []),
    print: say,
    printErr: say,
    onExit: function(code) { say("exit " + code); },
  };
  if (!crossOriginIsolated) {
    say("no threads: the page needs the Cross-Origin-Opener-Policy: "
      + "same-origin and Cross-Origin-Embedder-Policy: require-corp headers");
  }
  var frames = 0;
  setInterval(function() {
    var n = Module.bendFrames | 0;
    document.getElementById("bend-rate").textContent = (n - frames) + " fps"
      + (Module.bendGpu ? ", ! on WebGPU" : "");
    frames = n;
  }, 1000);
</script>
<script src="../coi-serviceworker.js"></script>
<script src="index.js"></script>
